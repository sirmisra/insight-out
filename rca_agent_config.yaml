agent:
  name: RCA_PRESCRIPTIVE_AGENT
  database: RCA_DEMO
  schema: RCA_TOOLS
  fqn: RCA_DEMO.RCA_TOOLS.RCA_PRESCRIPTIVE_AGENT
  model: claude-4-sonnet
  warehouse: MANOHAR_MISHRA_WH
  budget:
    seconds: 300
    tokens: 60000
  description: >
    Domain-agnostic Root Cause Analysis & Prescriptive Analytics Agent.
    Works across healthcare, retail/FMCG, logistics, finance, manufacturing,
    marketing, exports, or any tabular dataset.
    Transitions from "What happened?" -> "Why?" -> "How to fix it?"

prerequisites:
  database: RCA_DEMO
  schema: RCA_DEMO.RCA_TOOLS
  stage: RCA_DEMO.RCA_TOOLS.RCA_STAGE
  setup_sql: |
    CREATE DATABASE IF NOT EXISTS RCA_DEMO;
    CREATE SCHEMA IF NOT EXISTS RCA_DEMO.RCA_TOOLS;
    CREATE STAGE IF NOT EXISTS RCA_DEMO.RCA_TOOLS.RCA_STAGE;

agent_spec_format:
  spec_language: YAML
  note: >
    CREATE AGENT uses YAML (not JSON) inside $$ delimiters.
    Generic tools MUST include input_schema.
    tool_resources for stored procedures use type: "procedure".
    tool_resources for UDFs use type: "function".

column_classification:
  description: >
    Schema Discovery auto-classifies every numeric column as either an ID or a measure.
    The agent MUST respect this classification throughout all phases.
  id_detection_rules:
    by_suffix:
      - _ID
      - _KEY
      - _FK
      - _PK
      - _CODE
      - _NUM
      - _NUMBER
      - _SEQ
      - _IDX
    by_exact_name:
      - ID
      - KEY
      - PK
      - FK
      - INDEX
      - SEQ
      - ROW_NUMBER
      - ROWNUM
    by_prefix:
      - SK_
      - FK_
      - PK_
    by_cardinality: >
      If a numeric column has >90% distinct values and >20 unique values,
      it is reclassified as a likely ID even if its name doesn't match patterns.
  output_buckets:
    id_columns_NEVER_USE_AS_TREATMENT_OR_METRIC:
      description: >
        Surrogate keys, foreign keys, sequence numbers.
        Examples: CUSTOMER_ID, TRANSACTION_ID, PRODUCT_ID, CLAIM_ID, ORDER_ID.
        NEVER use as metrics, treatment variables, confounder variables, or dimension slicers.
    measure_columns_USE_AS_METRICS_AND_TREATMENTS:
      description: >
        Real numeric measures representing business quantities.
        Examples: REVENUE, QUANTITY, PRICE, DISCOUNT_PCT, DAYS_SUPPLY, PATIENT_PAY, WEIGHT, DELAY_HOURS.
        Use as outcome metric, treatment variables, or decision variables in optimization.
    dimension_columns_USE_FOR_SLICING_AND_CONFOUNDERS:
      description: >
        Text and boolean columns representing categories.
        Examples: REGION, PRODUCT_TYPE, PHARMACY_TYPE, CHANNEL, IS_REFILL, CATEGORY.
        Use for dimension slicing in descriptive analytics, and as confounder columns in causal inference.

execution_behavior:
  description: >
    The agent has exactly ONE pause point (Phase 2 Human Checkpoint).
    After user confirms, Phases 3 through Report run back-to-back without stopping.
  phases:
    phase_0: "Schema Discovery - auto-run"
    phase_1: "Descriptive Analytics - auto-run"
    phase_2: "Human Checkpoint - ONLY pause point. Agent presents findings, proposes causal factors, waits for user."
    phase_3: "Causal Inference - auto-run after confirmation"
    phase_4: "Prescriptive Optimization - auto-run"
    phase_5: "Monte Carlo Simulation - auto-run"
    report: "Generate Report - auto-run, delivers Executive Report"
  continuous_after_checkpoint: true
  reason_for_300s_budget: >
    Phases 3-5 plus report generation can require 4+ tool calls in sequence.
    With retries, the chain can reach 10+ calls. 180s was insufficient; 300s accommodates
    the full pipeline including error recovery.

